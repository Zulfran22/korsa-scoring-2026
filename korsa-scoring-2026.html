<!DOCTYPE html>
<html lang="id" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORSA 2026 — Scoring Tenis Meja</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   1 · WARNA — PALET KORSA 2026
   Diambil dari logo turnamen: navy obor + oranye api.
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --korsa-navy-10:  #EEF1FC;
  --korsa-navy-20:  #D3DAF6;
  --korsa-navy-30:  #B4C0EE;
  --korsa-navy-40:  #8B9CE2;
  --korsa-navy-50:  #6C7FD8;
  --korsa-navy-60:  #3A52C4;
  --korsa-navy-70:  #2B3F9E;
  --korsa-navy-80:  #1A2B8C;   /* primary — navy KORSA */
  --korsa-navy-90:  #101B5C;
  --korsa-navy-100: #0A0F2E;   /* ground videotron */

  --korsa-orange-10: #FEF0E7;
  --korsa-orange-20: #FCD9C4;
  --korsa-orange-40: #F79A5E;
  --korsa-orange-60: #F26B21;  /* accent — oranye KORSA */
  --korsa-orange-70: #D4580E;
  --korsa-orange-80: #A8440A;

  /* Peran warna */
  --primary-main:    var(--korsa-navy-80);
  --primary-hover:   var(--korsa-navy-90);
  --primary-pressed: var(--korsa-navy-100);
  --primary-border:  var(--korsa-navy-20);
  --primary-surface: var(--korsa-navy-10);

  --accent-main:    var(--korsa-orange-60);
  --accent-hover:   var(--korsa-orange-70);
  --accent-pressed: var(--korsa-orange-80);
  --accent-border:  var(--korsa-orange-20);
  --accent-surface: var(--korsa-orange-10);

  /* ═════════════════════════════════════════════════════════════════════
     2 · SKALA NON-WARNA — Granule - Mobile Design System
     Nilai asli dari Figma. Hanya paletnya yang diganti ke KORSA;
     spasi, radius, ketebalan garis, dan status tetap ikut DS.
     ═════════════════════════════════════════════════════════════════════ */

  /* Global Tokens · Neutral */
  --neutral-10:  #FFFFFF;
  --neutral-20:  #EFF2F6;
  --neutral-30:  #E2E7EE;
  --neutral-40:  #D1D7E1;
  --neutral-50:  #B9C3CF;
  --neutral-60:  #A4AFBD;
  --neutral-70:  #8B95A3;
  --neutral-80:  #6E7580;
  --neutral-90:  #525861;
  --neutral-100: #31353A;

  /* Global Tokens · Semantic */
  --success-main:    #31815A;
  --success-hover:   #2A6F4D;
  --success-surface: #E9F7F0;
  --success-border:  #B8E0CD;
  --error-main:      #CB3A31;
  --error-surface:   #FFF5F5;
  --error-border:    #EDB9B5;

  /* Global Tokens · Scale Margin */
  --margin-2xs:  2px;
  --margin-xs:   4px;
  --margin-s:    8px;
  --margin-m:   12px;
  --margin-l:   16px;
  --margin-xl:  24px;
  --margin-2xl: 32px;
  --margin-3xl: 40px;
  --margin-4xl: 48px;

  /* Global Tokens · Scale/Radius */
  --radius-xs:    4px;
  --radius-s:     8px;
  --radius-m:    12px;
  --radius-l:    16px;
  --radius-full: 999px;

  /* Global Tokens · Scale/weight */
  --stroke-xs: 1px;
  --stroke-s:  1.5px;
  --stroke-m:  2px;
  --stroke-l:  4px;
  --stroke-xl: 8px;

  /* Component Token · Button/Default/Buttom-Radius */
  --button-radius: 999px;

  /* ═════════════════════════════════════════════════════════════════════
     3 · LAPIS APLIKASI
     ═════════════════════════════════════════════════════════════════════ */
  --app-bg:             var(--neutral-20);
  --app-surface:        var(--neutral-10);
  --app-surface-sunken: var(--neutral-20);
  --app-border:         var(--neutral-30);
  --app-border-strong:  var(--neutral-40);

  --app-text:        var(--neutral-100);
  /* Teks sekunder tidak cuma tampil di atas putih, tapi juga di atas
     permukaan cekung Neutral/20 (segmented, pill, stepper, kode slot).
     Neutral/80 hanya 4,14:1 di sana → Neutral/90 lolos di kedua latar. */
  --app-text-muted:  var(--neutral-90);
  --app-text-subtle: var(--neutral-80);

  /* Oranye KORSA terlalu terang untuk teks putih (3,04:1) — tinta gelap
     di atas oranye justru 5,6:1 dan warnanya tetap penuh. */
  --btn-accent-fg:  var(--korsa-navy-100);
  /* Label fase berukuran 10px di atas putih maupun Neutral/20; orange-70
     hanya ±3,6:1 di sana, orange-80 lolos. */
  --match-phase-fg: var(--accent-pressed);
  --side-lead-fg:   var(--accent-pressed);

  /* Batas input wajib >=3:1 (WCAG 1.4.11). Neutral/40 cuma 1,5:1. */
  --input-border:       var(--neutral-70);
  --input-border-hover: var(--neutral-80);
  --focus-ring-color:   var(--korsa-navy-60);

  --font-base: system-ui, "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --text-2xs: 10px;
  --text-xs:  11px;
  --text-s:   13px;
  --text-m:   15px;
  --text-l:   18px;
  --text-xl:  22px;
  --text-3xl: 40px;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;
  --weight-black:    800;
  --tracking-wide:  0.06em;
  --tracking-wider: 0.14em;

  --elevation-1: 0 1px 2px rgba(10,15,46,.07), 0 1px 3px rgba(10,15,46,.05);
  --elevation-2: 0 4px 12px rgba(10,15,46,.12), 0 1px 3px rgba(10,15,46,.07);

  --focus-ring: 0 0 0 3px var(--focus-ring-color);

  /* Strip header & footer panel videotron selalu navy di kedua mode,
     jadi teks di atasnya tidak boleh ikut membalik bersama mode. */
  --vt-onstrip:     var(--neutral-10);
  --vt-onstrip-dim: var(--korsa-navy-40);
}

/* ═══════════════════════════════════════════════════════════════════════════
   4 · MODE VIDEOTRON
   Disetel untuk panel LED, bukan monitor:
     · Ground near-black (#0A0F2E) — piksel LED nyaris mati, kontras maksimum,
       konsumsi daya rendah, dan tidak ada gradient yang bisa banding.
     · Semua warna solid. Overlay rgba dan gradasi halus sering pecah jadi
       pita saat lewat video processor LED.
     · Teks minimum putih penuh atau navy-40; abu netral dibuang karena
       jatuh di bawah 4,5:1 pada ground ini.
     · Stroke dinaikkan satu langkah — garis 1px hilang di pitch LED besar.
   ═══════════════════════════════════════════════════════════════════════════ */
#display {
  /* Area aman anti-crop. Default 0 supaya papan penuh sampai tepi layar —
     berapa pun nilainya, ia tampak sebagai bingkai mengelilingi papan.
     Naikkan (mis. 1.2%) HANYA kalau video processor panel LED terbukti
     memotong tepi; --vt-frame adalah warna zona mati itu. */
  --vt-safe: 0;
  --vt-frame: #000000;

  /* Garis pemisah strip kepala sel. Di mode gelap strip sewarna badan sel
     sehingga garis ini yang memikul pembedaan; navy-50 lolos 3:1 di kedua
     mode (5,05:1 di navy-100, 4,31:1 di navy-90). */
  --vt-rule: var(--korsa-navy-50);
}

/* ── MODE GELAP (default) ─────────────────────────────────────────────────
   Untuk videotron di ruangan gelap atau panel LED indoor.
   Hanya dua tingkat kedalaman: beberapa biru gelap yang mirip justru jadi
   pita di panel LED, jadi status dibedakan lewat bar aksen dan pill.       */
#display[data-vt-mode="dark"] {
  /* Satu-satunya permukaan yang diangkat adalah band pemimpin. Sebelumnya
     strip header sel juga navy-90 sehingga band tidak terbaca sebagai baris
     yang ditonjolkan — malah seperti header kedua. Sekarang strip menyatu
     dengan badan sel dan cuma dipisah garis navy-70. */
  --vt-cell:             var(--korsa-navy-100);
  --vt-cell-head:        var(--korsa-navy-100);
  --vt-cell-finished:    var(--korsa-navy-100);
  --vt-lift:             var(--korsa-navy-90);   /* header & footer panel */
  --vt-gap:              #000000;
  /* Oranye butuh latar <= navy-90 agar tembus 4,5:1 (di navy-80 hanya 3,9) */
  --vt-band-lead:        var(--korsa-navy-90);

  --vt-text:             var(--neutral-10);
  --vt-text-dim:         var(--korsa-navy-40);
  --vt-text-quiet:       var(--korsa-navy-50);

  --vt-lead:             var(--korsa-orange-60);
  /* Angka harus lebih kuat dari nama tim; sebelumnya keduanya navy-40
     sehingga skor tim tertinggal tenggelam sederajat namanya. */
  --vt-trail:            var(--korsa-navy-30);
  --vt-live:             #2FD07A;   /* Success/Main hanya ±2,7:1 di ground ini */
  --vt-live-fg:          var(--korsa-navy-100);

  /* Bidang sedikit lebih terang menjaga semua siluet logo tetap utuh terbaca. */
  --vt-plate:            var(--korsa-navy-90);
  --vt-meter-track:      var(--korsa-navy-90);
  --vt-meter-track-lead: var(--korsa-navy-100);

  --vt-cellhead-fg:      var(--neutral-10);
  --vt-phase-fg:         var(--accent-main);   /* oranye-60 kuat di atas navy */
}

/* ── MODE TERANG ──────────────────────────────────────────────────────────
   Untuk panel LED outdoor atau GOR yang terang, dan proyektor.
   Navy disisakan untuk chrome global saja (header & footer panel) supaya
   identitas KORSA terjaga. Strip kepala sel dulu memakai navy-90 yang PERSIS
   sama dengan header global, jadi keduanya berbobot setara dan papan terbaca
   sebagai tumpukan pita navy; sekarang strip itu jadi permukaan terang
   sehingga sel putih terbaca sebagai panel bersih dan hierarkinya jelas.
   Plate logo tetap gelap — logo HUMACTIVE, NITREA, PRECIPALM, dan BIODEX
   bergaris putih dan hilang di latar terang.                               */
#display[data-vt-mode="light"] {
  --vt-cell:             var(--neutral-10);
  --vt-cell-head:        var(--neutral-30);      /* beda dari sel selesai (neutral-20) */
  --vt-cell-finished:    var(--neutral-20);
  --vt-lift:             var(--korsa-navy-90);
  --vt-gap:              var(--neutral-40);
  --vt-band-lead:        var(--korsa-orange-10);
  --vt-rule:             var(--neutral-50);      /* navy-50 terlalu mencolok di strip terang */

  --vt-cellhead-fg:      var(--korsa-navy-100);
  /* Oranye-60 cuma ±3:1 di atas permukaan terang — turun ke oranye-80 (±6:1) */
  --vt-phase-fg:         var(--accent-pressed);

  --vt-text:             var(--korsa-navy-100);
  --vt-text-dim:         var(--korsa-navy-70);
  --vt-text-quiet:       var(--korsa-navy-60);

  --vt-lead:             var(--korsa-orange-80);
  --vt-trail:            var(--korsa-navy-80);   /* satu langkah di atas nama */
  /* Success/Main (#31815A) hanya 4,26:1 untuk skor pemenang di atas band
     oranye-10 — turun satu langkah ke Success/Hover menaikkannya ke 5,2:1 */
  --vt-live:             var(--success-hover);
  --vt-live-fg:          var(--neutral-10);

  --vt-plate:            var(--korsa-navy-100);
  --vt-meter-track:      var(--neutral-30);
  --vt-meter-track-lead: var(--korsa-orange-20);
}

/* ═══════════════════════════════════════════════════════════════════════════
   5 · BASE
   ═══════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-base);
  font-size: var(--text-s);
  color: var(--app-text);
  background: var(--app-bg);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
img { max-width: 100%; display: block; }

.u-num { font-variant-numeric: tabular-nums; }
.u-eyebrow {
  font-size: var(--text-2xs);
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--app-text-muted);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--app-border-strong);
  border: 3px solid transparent;
  background-clip: content-box;
  border-radius: var(--radius-full);
}

/* Logo plate selalu gelap — logo HUMACTIVE / NITREA / PRECIPALM / BIODEX
   bergaris putih, jadi hilang di atas kartu putih. */
.plate {
  flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--korsa-navy-100);
  border-radius: var(--radius-s);
  overflow: hidden;
}
.plate img {
  width: 100%; height: 100%;
  padding: 9%;
  object-fit: contain;
  object-position: center;
}
.plate--mono {
  font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wide);
  color: var(--korsa-navy-40);
}
#display .plate {
  background: var(--vt-plate);
  overflow: visible;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6 · KONTROL
   ═══════════════════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: var(--margin-s);
  height: 38px; padding: 0 var(--margin-l);
  border-radius: var(--button-radius);
  font-size: var(--text-s);
  font-weight: var(--weight-semibold);
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
.btn--primary { background: var(--primary-main); color: var(--neutral-10); }
.btn--primary:hover { background: var(--primary-hover); }
.btn--accent { background: var(--accent-main); color: var(--btn-accent-fg); }
.btn--accent:hover { background: var(--accent-hover); }
.btn--outline {
  background: var(--app-surface);
  color: var(--app-text);
  border: var(--stroke-xs) solid var(--app-border-strong);
}
.btn--outline:hover { background: var(--app-surface-sunken); }
.btn--quiet {
  height: 30px; padding: 0 var(--margin-m);
  font-size: var(--text-2xs); font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-wide); text-transform: uppercase;
  color: var(--app-text-muted);
  border-radius: var(--button-radius);
}
.btn--quiet:hover { background: var(--error-surface); color: var(--error-main); }
.btn__icon { font-size: var(--text-m); line-height: 1; }
.btn__svg { width: 16px; height: 16px; flex-shrink: 0; }

.segmented {
  display: inline-flex; gap: var(--margin-2xs);
  padding: 3px;
  background: var(--app-surface-sunken);
  border: var(--stroke-xs) solid var(--app-border);
  border-radius: var(--radius-full);
}
.segmented__item {
  min-width: 34px; height: 30px; padding: 0 var(--margin-m);
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-wide);
  color: var(--app-text-muted);
  transition: background .15s, color .15s;
}
.segmented__item:hover { background: var(--app-surface); color: var(--app-text); }
.segmented__item[aria-pressed="true"] {
  background: var(--app-surface);
  color: var(--primary-main);
  box-shadow: var(--elevation-1);
}
/* Status terpilih selalu isian solid, bukan cuma ganti warna teks — kalau
   hanya LIVE yang berisi, status terpilih pada MENUNGGU/SELESAI jadi ragu. */
.segmented--status .segmented__item { flex: 1; }
.segmented--status .segmented__item[aria-pressed="true"] {
  color: var(--neutral-10);
  box-shadow: none;
}
.segmented--status .segmented__item[aria-pressed="true"][data-status="waiting"]  { background: var(--primary-main); }
.segmented--status .segmented__item[aria-pressed="true"][data-status="live"]     { background: var(--success-main); }
.segmented--status .segmented__item[aria-pressed="true"][data-status="finished"] { background: var(--neutral-90); }

/* Ketiga status memakai struktur yang sama — isian + garis tepi sewarna —
   supaya bedanya cuma warna, bukan bobot. Sebelumnya hanya LIVE yang punya
   isian solid sehingga MENUNGGU dan SELESAI terbaca sebagai teks biasa. */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 var(--margin-m);
  border: var(--stroke-xs) solid transparent;
  border-radius: var(--radius-full);
  font-size: var(--text-2xs);
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}
.pill--waiting {
  background: var(--primary-surface);
  border-color: var(--primary-border);
  color: var(--primary-main);
}
.pill--live { background: var(--success-main); border-color: var(--success-main); color: var(--neutral-10); }
.pill--finished {
  background: var(--app-surface-sunken);
  border-color: var(--app-border-strong);
  color: var(--app-text-muted);
}

.dot { width: 7px; height: 7px; border-radius: var(--radius-full); background: currentColor; flex-shrink: 0; }
.pill--live .dot { animation: blink 2s steps(1, end) infinite; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pill--live .dot { animation: none; } }

/* ═══════════════════════════════════════════════════════════════════════════
   7 · ADMIN · APP BAR
   ═══════════════════════════════════════════════════════════════════════════ */
#admin { min-height: 100vh; display: flex; flex-direction: column; }

.appbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--margin-xl);
  padding: var(--margin-s) var(--margin-xl);
  background: var(--app-surface);
  border-bottom: var(--stroke-xs) solid var(--app-border);
  box-shadow: var(--elevation-1);
}
.appbar::after {
  content: ""; position: absolute; inset: auto 0 -3px 0;
  height: var(--stroke-l);
  background: linear-gradient(90deg, var(--primary-main), var(--accent-main));
}
.brand { display: flex; align-items: center; gap: var(--margin-l); min-width: 0; }
.brand__logo { height: 46px; width: auto; }
.brand__rule { width: var(--stroke-xs); height: 34px; background: var(--app-border); }
.brand__title {
  font-size: var(--text-m);
  font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wide);
  white-space: nowrap;
}
.brand__meta { font-size: var(--text-xs); color: var(--app-text-muted); white-space: nowrap; }

.appbar__tools { margin-left: auto; display: flex; align-items: center; gap: var(--margin-m); flex-wrap: wrap; }
.field-inline { display: flex; align-items: center; gap: var(--margin-s); }
.field-inline > .u-eyebrow { white-space: nowrap; }

.clock {
  font-size: var(--text-l);
  font-weight: var(--weight-bold);
  letter-spacing: .04em;
  color: var(--primary-main);
  padding-right: var(--margin-s);
}

/* ═══════════════════════════════════════════════════════════════════════════
   8 · ADMIN · WORKSPACE
   ═══════════════════════════════════════════════════════════════════════════ */
.workspace { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 328px; align-items: start; }
#admin[data-aside="closed"] .workspace { grid-template-columns: minmax(0, 1fr); }
#admin[data-aside="closed"] .schedule { display: none; }

.board {
  display: grid; gap: var(--margin-l);
  padding: var(--margin-l) var(--margin-xl) var(--margin-4xl);
  align-content: start;
}
.board[data-count="1"] { grid-template-columns: minmax(0, 640px); }
.board[data-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.board[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.board[data-count="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.match {
  background: var(--app-surface);
  border: var(--stroke-xs) solid var(--app-border);
  border-radius: var(--radius-m);
  box-shadow: var(--elevation-1);
  overflow: hidden;
  transition: box-shadow .2s, border-color .2s;
}
.match[data-status="live"] { border-color: var(--success-main); box-shadow: var(--elevation-2); }
/* overflow:hidden di atas membulatkan sudut kartu, tapi juga memotong dropdown
   pemilih tim yang lebih tinggi dari kartunya — dibuka sementara saat memilih. */
.match[data-pick="open"] { overflow: visible; }

/* Tiga tingkat yang jelas di strip kepala: nomor meja (utama), kode slot
   (sekunder, isian tipis bukan navy solid), lalu fase (tersier, netral).
   Sebelumnya ketiganya berbobot sama dan saling berebut. */
.match__head {
  display: flex; align-items: center; gap: var(--margin-m);
  padding: var(--margin-m) var(--margin-l);
  background: var(--app-surface-sunken);
  border-bottom: var(--stroke-xs) solid var(--app-border);
}
.match__table {
  font-size: var(--text-m); font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wide);
}
.match__code {
  font-size: var(--text-2xs); font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-wide);
  color: var(--primary-main); background: var(--primary-surface);
  border: var(--stroke-xs) solid var(--primary-border);
  padding: 2px 8px; border-radius: var(--radius-full);
  margin-left: calc(var(--margin-s) * -1);
}
.match__phase {
  font-size: var(--text-2xs); font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-wider); text-transform: uppercase;
  color: var(--app-text-subtle);
}
.match__head .pill { margin-left: auto; }

.match__body { padding: var(--margin-xs) var(--margin-l); }

.side {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto auto;
  align-items: center; gap: var(--margin-m);
  padding: var(--margin-m) 0 var(--margin-m) var(--margin-m);
  margin-left: calc(var(--margin-m) * -1);
  border-left: var(--stroke-l) solid transparent;
  border-radius: var(--radius-xs);
  transition: background .15s, border-color .15s;
}
.side + .side { border-top: var(--stroke-xs) solid var(--app-border); }
.side--leading { border-left-color: var(--accent-main); background: var(--accent-surface); }
.match[data-status="finished"] .side--leading { border-left-color: var(--success-main); background: var(--success-surface); }

.side__logo { width: 40px; height: 40px; font-size: var(--text-xs); }

/* Latar transparan supaya band sisi pemimpin terbaca sebagai satu baris utuh,
   bukan kotak formulir putih di atas warna. Garis tepi tetap dipertahankan:
   batas komponen input wajib >=3:1 (WCAG 1.4.11). */
.side__name {
  width: 100%; height: 36px; padding: 0 var(--margin-m);
  background: transparent;
  border: var(--stroke-xs) solid var(--input-border);
  border-radius: var(--radius-s) 0 0 var(--radius-s);
  border-right: none;
  font-size: var(--text-s); font-weight: var(--weight-bold);
  letter-spacing: .02em; text-transform: uppercase;
  min-width: 0;
}
.side__name:hover { border-color: var(--input-border-hover); }
.side__name:focus { border-color: var(--primary-main); }

/* Pemilih tim — nama masih bisa diketik bebas (untuk label sementara seperti
   "JUARA POL A"), tapi tombol di sebelahnya membuka daftar tim berlogo supaya
   babak semifinal/perebutan 3/final tinggal pilih, bukan mengetik manual. */
.side__pick { position: relative; min-width: 0; display: flex; }
.side__pick .side__name { flex: 1; }
/* Menyatu dengan input jadi satu kontrol (bukan tombol lepas di sebelahnya),
   dan panahnya cukup besar untuk terbaca sebagai dropdown. */
.side__pickbtn {
  flex-shrink: 0;
  width: 32px; height: 36px;
  display: grid; place-items: center;
  background: var(--app-surface-sunken);
  border: var(--stroke-xs) solid var(--input-border);
  border-radius: 0 var(--radius-s) var(--radius-s) 0;
  color: var(--app-text-muted);
  font-size: var(--text-m); line-height: 1;
  transition: background .15s, border-color .15s, color .15s;
}
.side__pickbtn:hover { background: var(--primary-surface); border-color: var(--input-border-hover); color: var(--primary-main); }
.side__pickbtn[aria-expanded="true"] {
  background: var(--primary-main);
  border-color: var(--primary-main);
  color: var(--neutral-10);
}
.pick__chev { width: 12px; height: 12px; transition: transform .15s; }
.side__pickbtn[aria-expanded="true"] .pick__chev { transform: rotate(180deg); }

.teampop {
  position: absolute; z-index: 30;
  top: calc(100% + var(--margin-xs)); left: 0; right: 0;
  min-width: 172px;                    /* tetap terbaca di layout 3-4 meja */
  max-height: 328px; overflow-y: auto; /* cukup untuk 8 tim tanpa item terpotong */
  padding: var(--margin-xs);
  background: var(--app-surface);
  border: var(--stroke-xs) solid var(--app-border-strong);
  border-radius: var(--radius-s);
  box-shadow: var(--elevation-2);
}
.teampop__item {
  width: 100%;
  display: flex; align-items: center; gap: var(--margin-s);
  padding: var(--margin-xs) var(--margin-s);
  border-radius: var(--radius-xs);
  font-size: var(--text-s); font-weight: var(--weight-bold);
  letter-spacing: .02em; text-align: left;
  transition: background .15s, color .15s;
}
.teampop__item:hover { background: var(--primary-surface); color: var(--primary-main); }
.teampop__item .plate { width: 26px; height: 26px; font-size: 9px; }
.teampop__item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Skor tim tertinggal diredupkan — sama seperti logika videotron. Sebelumnya
   angka yang tertinggal hitam pekat sementara pemimpinnya oranye, jadi yang
   kalah justru tampak lebih berat. */
.side__score {
  min-width: 62px; text-align: center;
  font-size: var(--text-3xl); font-weight: var(--weight-black); line-height: 1;
  color: var(--app-text-subtle);
  font-variant-numeric: tabular-nums;
  transition: color .15s;
}
.side--leading .side__score { color: var(--side-lead-fg); }
.match[data-status="finished"] .side--leading .side__score { color: var(--success-hover); }

.stepper { display: flex; gap: var(--margin-xs); }
.stepper__btn {
  width: 42px; height: 42px;
  border-radius: var(--radius-s);
  font-size: var(--text-xl); font-weight: var(--weight-bold); line-height: 1;
  display: grid; place-items: center;
  transition: transform .08s, background .15s;
}
.stepper__btn:active { transform: scale(.92); }
/* Garis tepi supaya tombol kurang tetap terbaca sebagai tombol — tanpa ini
   ia hilang di atas baris bertint dan kalah jauh dari tombol tambah navy. */
.stepper__btn--dec {
  background: var(--app-surface);
  border: var(--stroke-xs) solid var(--app-border-strong);
  color: var(--app-text-muted);
}
.stepper__btn--dec:hover { background: var(--error-surface); border-color: var(--error-border); color: var(--error-main); }
.stepper__btn--inc { background: var(--primary-main); color: var(--neutral-10); }
.stepper__btn--inc:hover { background: var(--primary-hover); }

/* Garis tipis memisahkan kontrol status dari area skor, biar footer tidak
   terlihat menempel begitu saja di bawah baris tim. */
.match__foot {
  display: flex; align-items: center; gap: var(--margin-m);
  padding: var(--margin-m) var(--margin-l);
  border-top: var(--stroke-xs) solid var(--app-border);
  background: var(--app-surface-sunken);
}
.match__foot .segmented { flex: 1; background: var(--app-surface); }

/* ── Panel jadwal ──────────────────────────────────────────────────────── */
.schedule {
  position: sticky; top: 63px; height: calc(100vh - 63px);
  display: flex; flex-direction: column;
  background: var(--app-surface);
  border-left: var(--stroke-xs) solid var(--app-border);
}
.schedule__head {
  display: flex; align-items: center; gap: var(--margin-s);
  padding: var(--margin-l);
  border-bottom: var(--stroke-xs) solid var(--app-border);
}
.schedule__title { font-size: var(--text-s); font-weight: var(--weight-bold); }
.schedule__count { margin-left: auto; }
.schedule__list { flex: 1; overflow-y: auto; padding: var(--margin-s); }

.schedule__day {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: baseline; gap: var(--margin-s);
  padding: var(--margin-l) var(--margin-s) var(--margin-xs);
  background: var(--app-surface);
}
.schedule__phase { color: var(--match-phase-fg); }

.slot {
  width: 100%;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: var(--margin-s);
  padding: var(--margin-s);
  border: var(--stroke-xs) solid transparent;
  border-radius: var(--radius-s);
  text-align: left;
  transition: background .15s, border-color .15s;
}
.slot:hover { background: var(--primary-surface); border-color: var(--primary-border); }
.slot[data-loaded="true"] { background: var(--success-surface); border-color: var(--success-border); }
.slot__code {
  font-size: var(--text-2xs); font-weight: var(--weight-bold);
  color: var(--app-text-muted); background: var(--app-surface-sunken);
  padding: 3px 7px; border-radius: var(--radius-full);
  min-width: 32px; text-align: center;
}
.slot[data-loaded="true"] .slot__code { background: var(--success-main); color: var(--neutral-10); }
.slot__teams {
  display: block; font-size: var(--text-xs); font-weight: var(--weight-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.slot__vs { color: var(--app-text-subtle); font-weight: var(--weight-medium); }
.slot__time { display: block; font-size: var(--text-2xs); color: var(--app-text-muted); }
.slot__table {
  font-size: var(--text-2xs); font-weight: var(--weight-bold);
  color: var(--primary-main); background: var(--primary-surface);
  padding: 3px 8px; border-radius: var(--radius-full);
}

/* ═══════════════════════════════════════════════════════════════════════════
   9 · DISPLAY · VIDEOTRON
   ═══════════════════════════════════════════════════════════════════════════ */
#display { display: none; position: fixed; inset: 0; background: #000000; place-items: center; }
#display[data-open="true"] { display: grid; }

.vt {
  position: relative;
  display: flex; flex-direction: column;
  padding: var(--vt-safe);              /* safe area anti-crop */
  background: var(--vt-frame);
  overflow: hidden;
}
.vt[data-ratio="fill"]   { width: 100vw; height: 100vh; }
.vt[data-ratio="square"] { width: min(100vw, 100vh); height: min(100vw, 100vh); }

/* Header: warna rata, tanpa gradasi — gradasi halus jadi pita di panel LED */
.vt__head {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 3%;
  min-height: clamp(76px, 13vh, 118px);
  padding: clamp(10px, 1.5vh, 18px) 2.8%;
  background: var(--vt-lift);
  border-bottom: var(--stroke-l) solid var(--accent-main);
}
.vt__logo { height: clamp(56px, 9.2vmin, 112px); width: auto; }
.vt__event {
  min-width: 0;
  font-size: clamp(24px, 4.1vmin, 48px);
  font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--vt-onstrip);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.vt__event em { font-style: normal; color: var(--accent-main); }
.vt__clock {
  margin-left: auto;
  font-size: clamp(14px, 2.7vmin, 32px);
  font-weight: var(--weight-black);
  letter-spacing: .06em;
  color: var(--accent-main);
}

.vt[data-ratio="square"] .vt__head {
  min-height: clamp(66px, 11vh, 96px);
  gap: 2%;
  padding-inline: 2.2%;
}
.vt[data-ratio="square"] .vt__logo { height: clamp(44px, 7.2vmin, 82px); }
.vt[data-ratio="square"] .vt__event { font-size: clamp(20px, 3.35vmin, 38px); }
.vt[data-ratio="square"] .vt__clock { font-size: clamp(13px, 2.25vmin, 26px); }

.vt__grid {
  flex: 1; min-height: 0;
  display: grid;
  gap: var(--stroke-l);
  background: var(--vt-gap);
  transition: background .3s;
}
.vt__grid[data-layout="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.vt__grid[data-layout="2"] { grid-template-columns: 1fr; grid-template-rows: repeat(2, 1fr); }
.vt__grid[data-layout="3"] { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
.vt__grid[data-layout="3"] > :first-child { grid-column: 1 / -1; }
.vt__grid[data-layout="4"] { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }

/* ── Sel ───────────────────────────────────────────────────────────────── */
.cell {
  position: relative;
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  background: var(--vt-cell);
}
.cell[data-status="finished"] { background: var(--vt-cell-finished); }
.cell[data-status="live"]::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; z-index: 3;
  height: var(--stroke-xl);
  background: var(--accent-main);
}

.cell__head {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: clamp(8px, 1.4vmin, 18px);
  min-height: clamp(58px, 10.5vh, 86px);
  padding: clamp(8px, 1.2vh, 14px) 3.4%;
  background: var(--vt-cell-head);
  border-bottom: var(--stroke-m) solid var(--vt-rule);
}
.cell__table {
  font-size: clamp(30px, 6vmin, 68px);      /* max +30%, vmin +36% */
  font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wide);      /* longgar -> ketat, hemat ruang */
  text-transform: uppercase;
  color: var(--vt-cellhead-fg);
  white-space: nowrap;
  padding: clamp(6px, 1vh, 12px) 3.4%;       /* padding tipis, tinggi tetap */
  line-height: 1;
}
.cell__phase {
  min-width: 0;
  font-size: clamp(11px, 1.75vmin, 20px);
  font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--vt-phase-fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cell__head .pill {
  justify-self: end;
  min-width: 0;
  height: auto; padding: .34em .85em;
  font-size: clamp(10px, 1.55vmin, 18px);
  letter-spacing: var(--tracking-wider);
  white-space: nowrap;
}
.cell__head .pill--live     { background: var(--vt-live);       color: var(--vt-live-fg); }
.cell__head .pill--waiting  { background: var(--korsa-navy-70); color: var(--neutral-10); }
.cell__head .pill--finished { background: var(--korsa-navy-40); color: var(--korsa-navy-100); }

.vt[data-ratio="square"] .cell__head {
  gap: clamp(6px, 1vmin, 12px);
  min-height: clamp(54px, 9vh, 72px);
  padding-inline: 2.6%;
}
.vt[data-ratio="square"] .cell__table { font-size: clamp(22px, 3.8vmin, 42px); }
.vt[data-ratio="square"] .cell__phase { font-size: clamp(10px, 1.55vmin, 17px); }
.vt[data-ratio="square"] .cell__head .pill {
  padding: .3em .7em;
  font-size: clamp(9px, 1.35vmin, 15px);
}

/* ── Baris skor ────────────────────────────────────────────────────────── */
.cell__match {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: clamp(8px, 1.6vh, 16px) 3.4%; gap: clamp(8px, 2vh, 16px);
  overflow: hidden;
}

.row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 2%;
  min-height: 0;
  padding: clamp(6px, 1.2vh, 12px) 1.8%;
  border-radius: var(--radius-s);
  border-left: var(--stroke-xl) solid transparent;
}
.row--leading { background: var(--vt-band-lead); border-left-color: var(--vt-lead); }
.cell[data-status="finished"] .row--leading { border-left-color: var(--vt-live); }

.row__logo {
  width: var(--logo-size);
  height: var(--logo-size);
  font-size: calc(var(--logo-size) * .28);
}
.row__team { min-width: 0; }
.row__name {
  font-size: var(--name-size);
  font-weight: var(--weight-black);
  letter-spacing: .02em;
  line-height: 1.18;
  text-transform: uppercase;
  color: var(--vt-text-dim);
  white-space: nowrap;
  overflow: hidden;
}
.row--leading .row__name { color: var(--vt-text); }

/* Bar meter disembunyikan untuk layar 4 arah; nama kontingen jadi fokus utama. */
.row__meter {
  display: none;
}
.row--leading .row__meter { background: var(--vt-meter-track-lead); }
.row__meter i {
  display: block; height: 100%; width: 0;
  background: var(--vt-trail);
  border-radius: var(--radius-full);
  transition: width .35s ease;
}
.row--leading .row__meter i { background: var(--vt-lead); }
.cell[data-status="finished"] .row--leading .row__meter i { background: var(--vt-live); }

.row__score {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  font-size: var(--score-size);
  font-weight: var(--weight-black);
  line-height: 1.15;
  color: var(--vt-trail);
  min-width: 1.15em;
  min-height: 1.28em;
  text-align: right;
}
.row--leading .row__score { color: var(--vt-lead); }
.cell[data-status="finished"] .row--leading .row__score { color: var(--vt-live); }

/* Skala tipografi per layout — dinaikkan untuk jarak pandang GOR */
.vt__grid[data-layout="4"] .cell,
.vt__grid[data-layout="3"] .cell { --logo-size: clamp(38px, 7.2vmin, 88px);  --name-size: clamp(34px, 7vmin, 82px); --score-size: clamp(42px, 7.6vmin, 98px); }
.vt__grid[data-layout="3"] > :first-child { --logo-size: clamp(46px, 9vmin, 112px);  --name-size: clamp(42px, 8vmin, 96px); --score-size: clamp(56px, 11vmin, 138px); }
.vt__grid[data-layout="2"] .cell { --logo-size: clamp(50px, 9.8vmin, 122px); --name-size: clamp(44px, 7.4vmin, 92px); --score-size: clamp(62px, 12vmin, 150px); }
.vt__grid[data-layout="1"] .cell { --logo-size: clamp(68px, 16vmin, 210px); --name-size: clamp(58px, 9.5vmin, 126px); --score-size: clamp(90px, 20vmin, 260px); }

/* Panel setengah tinggi tetap memuat logo dan skor besar tanpa menyentuh footer. */
.vt__grid[data-layout="2"] .cell__match,
.vt__grid[data-layout="3"] > :first-child .cell__match {
  padding-block: clamp(2px, .35vh, 4px);
  gap: clamp(2px, .35vh, 4px);
}
.vt__grid[data-layout="2"] .row,
.vt__grid[data-layout="3"] > :first-child .row { padding-block: 0; }
.vt__grid[data-layout="2"] .row__score { min-height: 1.15em; }

/* Nama tim adalah informasi utama; label meja dibuat satu tingkat lebih kecil. */
.vt__grid[data-layout="4"] .cell__table,
.vt__grid[data-layout="3"] .cell__table { font-size: clamp(26px, 4vmin, 46px); }
.vt[data-ratio="square"] .vt__grid[data-layout="4"] .cell__table,
.vt[data-ratio="square"] .vt__grid[data-layout="3"] .cell__table { font-size: clamp(27px, 3.8vmin, 42px); }

.cell__tag {
  align-self: center; margin-top: 1.4%;
  font-size: clamp(10px, 1.6vmin, 18px);
  font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--vt-live-fg);
  background: var(--vt-live);
  padding: .34em 1.2em;
  border-radius: var(--radius-full);
}

/* ── Menunggu ──────────────────────────────────────────────────────────── */
.cell__wait {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(10px, 3%, 22px); padding: clamp(12px, 3%, 24px);
  text-align: center;
  overflow: hidden;
}
.cell__wait-label {
  font-size: clamp(16px, 2.3vmin, 28px);
  font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--vt-lead);
}
.cell__wait-fixture {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: start;
  gap: 4%;
  width: 100%;
  min-height: 0;
}
.cell__wait-team {
  display: grid;
  grid-template-rows: var(--logo-size) auto;
  justify-items: center;
  align-items: center;
  row-gap: .55em;
  width: 100%;
  min-width: 0;
}
.cell__wait-team .plate {
  width: var(--logo-size);
  height: var(--logo-size);
  font-size: calc(var(--logo-size) * .28);
}
.cell__wait-team span {
  display: block;
  max-width: 100%;
  font-size: var(--name-size);
  font-weight: var(--weight-black);
  letter-spacing: .02em;
  line-height: 1.18;
  text-transform: uppercase;
  color: var(--vt-text);
  white-space: nowrap;
  overflow: hidden;
}
.cell__wait-vs {
  display: flex;
  align-items: center;
  height: var(--logo-size);
  font-size: calc(var(--name-size) * .86);
  font-weight: var(--weight-black);
  color: var(--vt-text-quiet);
  flex-shrink: 0;
}
.cell__wait-time {
  font-size: clamp(16px, 2.5vmin, 30px);
  font-weight: var(--weight-black);
  letter-spacing: var(--tracking-wide);
  color: var(--vt-text-dim);
}
.cell__wait-brand { width: clamp(64px, 19vmin, 240px); }

/* Pada layar yang dibagi 3–4, tiap tim memakai satu baris penuh agar namanya besar. */
.vt__grid[data-layout="4"] .cell__wait-fixture,
.vt__grid[data-layout="3"] .cell__wait-fixture {
  grid-template-columns: 1fr;
  gap: clamp(4px, .8vh, 8px);
  width: min(94%, 820px);
}
.vt__grid[data-layout="4"] .cell__wait-team,
.vt__grid[data-layout="3"] .cell__wait-team {
  grid-template-columns: var(--logo-size) minmax(0, 1fr);
  grid-template-rows: var(--logo-size);
  justify-items: start;
  column-gap: clamp(10px, 2.4%, 20px);
}
.vt__grid[data-layout="4"] .cell__wait-team span,
.vt__grid[data-layout="3"] .cell__wait-team span {
  align-self: center;
  justify-self: start;
  text-align: left;
}
.vt__grid[data-layout="4"] .cell__wait-vs,
.vt__grid[data-layout="3"] .cell__wait-vs {
  height: auto;
  justify-self: center;
  font-size: clamp(18px, 3vmin, 30px);
  line-height: 1;
}
.vt__grid[data-layout="4"] .cell__wait,
.vt__grid[data-layout="3"] .cell__wait {
  gap: clamp(6px, 1.5%, 12px);
  padding: clamp(8px, 1.8%, 16px);
}

/* ── Footer & kontrol ──────────────────────────────────────────────────── */
.vt__foot {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center; gap: var(--margin-l);
  padding: .8% 2.4%;
  background: var(--vt-lift);
  border-top: var(--stroke-m) solid var(--korsa-navy-70);
}
.vt__foot span {
  font-size: clamp(9px, 1.3vmin, 15px);
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--vt-onstrip-dim);
}
.vt__foot i { color: var(--accent-main); font-style: normal; }

.vt__controls {
  position: fixed; top: var(--margin-l); right: var(--margin-l); z-index: 40;
  display: flex; gap: var(--margin-s);
  opacity: 0; transition: opacity .25s;
}
#display:hover .vt__controls, .vt__controls:focus-within { opacity: 1; }
.vt__controls .btn {
  background: var(--korsa-navy-90);
  color: var(--neutral-10);
  border: var(--stroke-xs) solid var(--korsa-navy-60);
}
.vt__controls .btn:hover { background: var(--korsa-navy-80); }

/* ═══════════════════════════════════════════════════════════════════════════
   10 · RESPONSIVE — breakpoint Granule: tablet 808, desktop 1224
   ═══════════════════════════════════════════════════════════════════════════ */
@media (max-width: 1224px) {
  .board[data-count="3"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1080px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .schedule { position: static; height: auto; max-height: 420px; border-left: none; border-top: var(--stroke-xs) solid var(--app-border); }
  .board[data-count="1"], .board[data-count="2"],
  .board[data-count="3"], .board[data-count="4"] { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 808px) {
  .appbar { flex-wrap: wrap; gap: var(--margin-s); padding: var(--margin-s) var(--margin-l); }
  .brand__meta { white-space: normal; }
  .board { padding: var(--margin-l); }
  .side {
    grid-template-columns: 40px minmax(0, 1fr) auto;
    grid-template-areas: "logo name score" "step step step";
  }
  .side__logo { grid-area: logo; width: 40px; height: 40px; }
  .side__pick { grid-area: name; }
  .side__score { grid-area: score; }
  .stepper { grid-area: step; }
  .stepper__btn { flex: 1; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════ ADMIN ══════════════════════════════ -->
<div id="admin" data-aside="open">

  <header class="appbar">
    <div class="brand">
      <img class="brand__logo" id="brand-logo" alt="KORSA 2026">
      <div class="brand__rule"></div>
      <div>
        <div class="brand__title">SCORING TENIS MEJA</div>
        <div class="brand__meta">GOR Pupuk Kaltim · 14–19 September 2026</div>
      </div>
    </div>

    <div class="appbar__tools">
      <div class="clock u-num" id="clock">00:00:00</div>

      <div class="field-inline">
        <span class="u-eyebrow">Meja aktif</span>
        <div class="segmented" id="table-count" role="group" aria-label="Jumlah meja aktif"></div>
      </div>

      <button class="btn btn--outline" id="toggle-aside"><span class="btn__icon">☰</span> Jadwal</button>
      <button class="btn btn--outline" onclick="resetAll()"><span class="btn__icon">↺</span> Reset</button>
      <button class="btn btn--accent" onclick="openDisplayWindow()">
        <svg class="btn__svg" viewBox="0 0 20 20" aria-hidden="true"><rect x="1.5" y="3" width="17" height="11.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 17.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Buka Display</button>
      <button class="btn btn--outline" onclick="openDisplay()" title="Pratinjau display di tab ini">Pratinjau</button>
    </div>
  </header>


  <div class="workspace">
    <main class="board" id="board" data-count="4"></main>

    <aside class="schedule">
      <div class="schedule__head">
        <h2 class="schedule__title">Jadwal Pertandingan</h2>
        <span class="u-eyebrow schedule__count" id="schedule-count"></span>
      </div>
      <div class="schedule__list" id="schedule-list"></div>
    </aside>
  </div>
</div>

<!-- ═════════════════════════════ DISPLAY ═════════════════════════════ -->
<div id="display" data-open="false" data-vt-mode="dark">
  <div class="vt__controls">
    <button class="btn" id="btn-vtmode" onclick="toggleVtMode()">☀ Mode Terang</button>
    <button class="btn" id="btn-ratio" onclick="toggleRatio()">1:1</button>
    <button class="btn" onclick="toggleFullscreen()">⛶ Layar Penuh</button>
    <button class="btn" onclick="closeDisplay()">✕ Tutup</button>
  </div>

  <div class="vt" id="vt" data-ratio="fill">
    <header class="vt__head">
      <img class="vt__logo" id="vt-logo" alt="KORSA 2026">
      <div class="vt__event">Tenis Meja <em>·</em> KORSA <em>2026</em></div>
      <div class="vt__clock u-num" id="vt-clock">00:00:00</div>
    </header>

    <div class="vt__grid" id="vt-grid" data-layout="4"></div>

    <footer class="vt__foot">
      <span>GOR Pupuk Kaltim</span><i>◆</i>
      <span>PT Pupuk Kalimantan Timur</span><i>◆</i>
      <span>14–19 September 2026</span>
    </footer>
  </div>
</div>

/* ═══════════════════════════════════════════════════════════════════════════

const defaultState = () => ({
  activeMeja: 4,
  ratio: 'fill',
  vtMode: 'dark',
  loaded: {},
  updatedAt: 0,
  tables: [1, 2, 3, 4].map(n => ({
    id: n, teamA: 'TIM A', teamB: 'TIM B',
    scoreA: 0, scoreB: 0, status: 'waiting', match: null
  }))
});

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.tables) || s.tables.length !== 4) return defaultState();
    const merged = Object.assign(defaultState(), s);
    if (![1, 2, 3, 4].includes(merged.activeMeja)) merged.activeMeja = 4;
    if (merged.vtMode !== 'light' && merged.vtMode !== 'dark') merged.vtMode = 'dark';
    if (merged.ratio !== 'fill' && merged.ratio !== 'square') merged.ratio = 'fill';
    if (!merged.loaded || typeof merged.loaded !== 'object' || Array.isArray(merged.loaded)) merged.loaded = {};
    return merged;
  } catch (e) { return defaultState(); }
}

let state = loadState();

const channel = ('BroadcastChannel' in window) ? new BroadcastChannel(STORE_KEY) : null;

function saveState() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  try { if (channel) channel.postMessage({ type: 'state', state: state }); } catch (e) {}
  syncToServer();
}

function adoptState(next) {
  state = Object.assign(defaultState(), next);
  renderTableCount();
  renderBoard();
  renderSchedule();
  syncVtMode();
  renderDisplay();
  syncRatio();
}

if (channel) channel.onmessage = e => { if (e.data && e.data.type === 'state') adoptState(e.data.state); };
window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY || !e.newValue) return;
  try { adoptState(JSON.parse(e.newValue)); } catch (err) {}
});

/* ═══════════════════════════════════════════════════════════════════════════
   SYNC · SERVER — inilah yang membuat admin & display bisa di dua perangkat
   berbeda. /api/state dilayani Netlify Function (netlify/functions/state.mjs)
   yang menyimpan skor di Netlify Blobs.
   Kalau endpoint-nya tidak ada, fetch gagal dan modul ini diam sendiri:
   localStorage + BroadcastChannel di atas tetap menyinkronkan antar tab di
   satu perangkat. JANGAN hapus syncToServer() — saveState() memanggilnya.
   ═══════════════════════════════════════════════════════════════════════════ */
let netSyncOn = false;

function syncToServer() {
  if (!netSyncOn) return;
  fetch('/api/state', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state)
  }).catch(() => {});
}

function pollServer() {
  fetch('/api/state').then(r => r.ok ? r.json() : null).then(next => {
    netSyncOn = true;
    /* Bandingkan updatedAt supaya hasil poll yang sedikit basi tidak
       menimpa perubahan lokal yang baru saja terjadi. */
    if (next && next.updatedAt && next.updatedAt > (state.updatedAt || 0)) adoptState(next);
  }).catch(() => {});
}
setInterval(pollServer, 1000);
pollServer();

/* ═══════════════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════════════ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

const normalize = name => String(name || '').trim().toUpperCase().replace(/\s+/g, ' ');

function monogram(name) {
  const n = normalize(name);
  if (!n) return '—';
  const all = n.split(' ');
  const words = all.filter(w => w !== 'NPK' && w !== 'TIM');
  const base = words.length ? words : all;
  return base.length === 1 ? base[0].slice(0, 3) : base.map(w => w[0]).join('').slice(0, 3);
}

function plateHTML(name, cls) {
  const src = LOGOS[normalize(name)];
  if (src) return '<div class="plate ' + cls + '"><img src="' + src + '" alt=""></div>';
  return '<div class="plate plate--mono ' + cls + '">' + esc(monogram(name)) + '</div>';
}

/* Daftar tim berlogo untuk dropdown di kartu meja. Nama tim dibawa lewat
   data-team, bukan diselipkan ke dalam string onclick, supaya tanda kutip
   pada nama tim tidak pernah bisa merusak atributnya. */
function teamPopHTML(id, key) {
  return '<div class="teampop" hidden>' +
    Object.keys(LOGOS).map(n =>
      '<button class="teampop__item" type="button" data-team="' + esc(n) + '"' +
      ' onclick="pickTeam(' + id + ', \'' + key + '\', this.dataset.team)">' +
        plateHTML(n, '') + '<span>' + esc(n) + '</span>' +
      '</button>').join('') +
  '</div>';
}

const getTable = id => state.tables.find(t => t.id === id);

const pillHTML = status =>
  '<span class="pill pill--' + status + '"><span class="dot"></span>' + STATUS_LABEL[status] + '</span>';

/* Lebar meter = skor relatif terhadap pemimpin, jadi selisih terlihat dari jauh */
const meterPct = (score, other) => {
  const max = Math.max(score, other, 1);
  return Math.round((score / max) * 100);
};

/* ═══════════════════════════════════════════════════════════════════════════
   ADMIN · RENDER
   ═══════════════════════════════════════════════════════════════════════════ */
function renderTableCount() {
  document.getElementById('table-count').innerHTML = [1, 2, 3, 4].map(n =>
    '<button class="segmented__item" aria-pressed="' + (n === state.activeMeja) + '"' +
    ' onclick="setActiveMeja(' + n + ')">' + n + '</button>').join('');
}

function renderBoard() {
  const board = document.getElementById('board');
  board.dataset.count = state.activeMeja;
  board.innerHTML = state.tables.filter(t => t.id <= state.activeMeja).map(matchCardHTML).join('');
}

function matchCardHTML(t) {
  const fixture = t.match ? MATCH_BY_ID[t.match] : null;

  const side = (key, name, score, leading) =>
    '<div class="side' + (leading ? ' side--leading' : '') + '" data-side="' + key + '">' +
      plateHTML(name, 'side__logo') +
      '<div class="side__pick">' +
        '<input class="side__name" type="text" value="' + esc(name) + '" maxlength="18" list="team-names"' +
        ' aria-label="Nama tim ' + key + ' meja ' + t.id + '"' +
        ' oninput="updateTeam(' + t.id + ', \'' + key + '\', this.value)">' +
        '<button class="side__pickbtn" type="button" aria-expanded="false"' +
        ' aria-label="Pilih tim ' + key + ' meja ' + t.id + ' dari daftar"' +
        ' onclick="toggleTeamPop(this)">' +
        '<svg class="pick__chev" viewBox="0 0 12 12" aria-hidden="true">' +
        '<path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.9"' +
        ' stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        teamPopHTML(t.id, key) +
      '</div>' +
      '<div class="side__score u-num">' + score + '</div>' +
      '<div class="stepper">' +
        '<button class="stepper__btn stepper__btn--dec" aria-label="Kurangi skor tim ' + key + '"' +
        ' onclick="changeScore(' + t.id + ', \'' + key + '\', -1)">−</button>' +
        '<button class="stepper__btn stepper__btn--inc" aria-label="Tambah skor tim ' + key + '"' +
        ' onclick="changeScore(' + t.id + ', \'' + key + '\', 1)">+</button>' +
      '</div>' +
    '</div>';

  const statusBtn = s =>
    '<button class="segmented__item" data-status="' + s + '" aria-pressed="' + (t.status === s) + '"' +
    ' onclick="setStatus(' + t.id + ', \'' + s + '\')">' + STATUS_LABEL[s].toUpperCase() + '</button>';

  return '<section class="match" id="card-' + t.id + '" data-status="' + t.status + '" aria-label="Meja ' + t.id + '">' +
    '<header class="match__head">' +
      '<span class="match__table">MEJA ' + t.id + '</span>' +
      (t.match ? '<span class="match__code">' + esc(t.match) + '</span>' : '') +
      (fixture ? '<span class="match__phase">' + esc(fixture.phase) + '</span>' : '') +
      pillHTML(t.status) +
    '</header>' +
    '<div class="match__body">' +
      side('A', t.teamA, t.scoreA, t.scoreA > t.scoreB) +
      side('B', t.teamB, t.scoreB, t.scoreB > t.scoreA) +
    '</div>' +
    '<footer class="match__foot">' +
      '<div class="segmented segmented--status" role="group" aria-label="Status meja ' + t.id + '">' +
        statusBtn('waiting') + statusBtn('live') + statusBtn('finished') +
      '</div>' +
      '<button class="btn btn--quiet" onclick="resetTable(' + t.id + ')">Nol-kan skor</button>' +
    '</footer>' +
  '</section>';
}

/* Update in-place agar fokus pada input nama tidak hilang saat mengetik */
function refreshCard(id) {
  const t = getTable(id);
  const card = document.getElementById('card-' + id);
  if (!t || !card) return;

  card.dataset.status = t.status;

  const pill = card.querySelector('.match__head .pill');
  pill.className = 'pill pill--' + t.status;
  pill.innerHTML = '<span class="dot"></span>' + STATUS_LABEL[t.status];

  card.querySelectorAll('.segmented--status .segmented__item').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.status === t.status));
  });

  [['A', t.scoreA, t.scoreA > t.scoreB], ['B', t.scoreB, t.scoreB > t.scoreA]].forEach(entry => {
    const row = card.querySelector('.side[data-side="' + entry[0] + '"]');
    if (!row) return;
    row.classList.toggle('side--leading', entry[2]);
    row.querySelector('.side__score').textContent = entry[1];
  });
}

function renderSchedule() {
  const list = document.getElementById('schedule-list');
  document.getElementById('schedule-count').textContent =
    Object.keys(state.loaded).length + '/' + SCHEDULE.length + ' dimuat';

  let html = '', lastDate = '';
  SCHEDULE.forEach(m => {
    if (m.date !== lastDate) {
      lastDate = m.date;
      html += '<div class="schedule__day u-eyebrow">' + m.day + ', ' + m.date +
              '<span class="schedule__phase u-eyebrow">' + m.phase + '</span></div>';
    }
    html += '<button class="slot" data-loaded="' + (m.id in state.loaded) + '"' +
            ' onclick="loadMatch(\'' + m.id + '\')" title="Muat ke meja ' + m.meja + '">' +
              '<span class="slot__code">' + m.id + '</span>' +
              '<span>' +
                '<span class="slot__teams">' + esc(m.teamA) +
                  ' <span class="slot__vs">vs</span> ' + esc(m.teamB) + '</span>' +
                '<span class="slot__time u-num">' + m.time + ' WITA</span>' +
              '</span>' +
              '<span class="slot__table">M' + m.meja + '</span>' +
            '</button>';
  });
  list.innerHTML = html;
}

function renderTeamNames() {
  document.getElementById('team-names').innerHTML =
    Object.keys(LOGOS).map(n => '<option value="' + esc(n) + '">').join('');
}

/* ═══════════════════════════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════════════════════════ */
function setActiveMeja(n) {
  state.activeMeja = n;
  saveState();
  renderTableCount();
  renderBoard();
  renderDisplay();
}

function updateTeam(id, side, value) {
  const t = getTable(id);
  const name = value.toUpperCase();
  if (side === 'A') t.teamA = name; else t.teamB = name;
  saveState();
  refreshSideLogo(id, side, name);
  renderDisplay();
}

/* Tukar hanya logo barisnya, tanpa render ulang kartu — supaya fokus dan
   posisi kursor di input nama tidak hilang saat mengetik. Selektornya harus
   .side__logo, bukan .plate: dropdown tim juga berisi .plate. */
function refreshSideLogo(id, side, name) {
  const row = document.querySelector('#card-' + id + ' .side[data-side="' + side + '"]');
  if (!row) return;
  const plate = row.querySelector('.side__logo');
  if (plate) plate.outerHTML = plateHTML(name, 'side__logo');
}

function toggleTeamPop(btn) {
  const pop = btn.parentElement.querySelector('.teampop');
  const willOpen = pop.hidden;
  closeTeamPops();
  if (willOpen) {
    pop.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    const card = btn.closest('.match');
    if (card) card.dataset.pick = 'open';
  }
}

function closeTeamPops() {
  document.querySelectorAll('.teampop').forEach(p => { p.hidden = true; });
  document.querySelectorAll('.side__pickbtn').forEach(b => b.setAttribute('aria-expanded', 'false'));
  document.querySelectorAll('.match[data-pick="open"]').forEach(c => { delete c.dataset.pick; });
}

function pickTeam(id, side, name) {
  closeTeamPops();
  const t = getTable(id);
  if (side === 'A') t.teamA = name; else t.teamB = name;
  saveState();

  const row = document.querySelector('#card-' + id + ' .side[data-side="' + side + '"]');
  if (row) row.querySelector('.side__name').value = name;
  refreshSideLogo(id, side, name);
  renderDisplay();
}

function changeScore(id, side, delta) {
  const t = getTable(id);
  if (side === 'A') t.scoreA = Math.max(0, t.scoreA + delta);
  else t.scoreB = Math.max(0, t.scoreB + delta);
  saveState();
  refreshCard(id);
  renderDisplay();
}

function setStatus(id, status) {
  getTable(id).status = status;
  saveState();
  refreshCard(id);
  renderDisplay();
}

function resetTable(id) {
  const t = getTable(id);
  t.scoreA = 0; t.scoreB = 0; t.status = 'waiting';
  saveState();
  refreshCard(id);
  renderDisplay();
}

function loadMatch(matchId) {
  const m = MATCH_BY_ID[matchId];
  if (!m) return;
  const target = m.meja <= state.activeMeja ? m.meja : 1;
  const t = getTable(target);
  /* Meja tujuan sudah terisi pertandingan lain — konfirmasi dulu supaya
     skor live atau hasil yang sudah dicatat tidak tertimpa tanpa sadar. */
  if (t.status !== 'waiting' || t.match) {
    const busy = 'Meja ' + target + ' masih berisi ' + t.teamA + ' vs ' + t.teamB + ' (' + STATUS_LABEL[t.status] + ').';
    if (!confirm(busy + ' Timpa dengan jadwal ini?')) return;
  }
  t.teamA = m.teamA; t.teamB = m.teamB;
  t.scoreA = 0; t.scoreB = 0; t.status = 'waiting'; t.match = m.id;
  state.loaded[m.id] = target;
  saveState();
  renderBoard();
  renderSchedule();
  renderDisplay();
}

function resetAll() {
  if (!confirm('Reset semua skor, status, dan jadwal yang sudah dimuat?')) return;
  /* Preferensi tampilan bukan data pertandingan — jangan ikut di-reset */
  const { ratio, vtMode } = state;
  state = defaultState();
  state.ratio = ratio;
  state.vtMode = vtMode;
  saveState();
  renderTableCount();
  renderBoard();
  renderSchedule();
  renderDisplay();
}

/* ═══════════════════════════════════════════════════════════════════════════
   DISPLAY · RENDER
   ═══════════════════════════════════════════════════════════════════════════ */
function renderDisplay() {
  const grid = document.getElementById('vt-grid');
  if (!grid) return;
  grid.dataset.layout = state.activeMeja;
  grid.innerHTML = state.tables.filter(t => t.id <= state.activeMeja).map(cellHTML).join('');
  requestAnimationFrame(fitDisplayTeamNames);
}

/* Pertahankan semua nama kontingen dalam satu baris tanpa melewati ruang skor. */
function fitDisplayTeamNames() {
  document.querySelectorAll('#vt-grid .row__name, #vt-grid .cell__wait-team span').forEach(el => {
    el.style.fontSize = '';
    const available = el.clientWidth;
    const preferred = parseFloat(getComputedStyle(el).fontSize);
    if (!available || el.scrollWidth <= available) return;

    let low = Math.max(12, preferred * .48);
    let high = preferred;
    for (let i = 0; i < 8; i++) {
      const size = (low + high) / 2;
      el.style.fontSize = size + 'px';
      if (el.scrollWidth <= available) low = size;
      else high = size;
    }
    el.style.fontSize = low + 'px';
  });
}

function cellHTML(t) {
  const fixture = t.match ? MATCH_BY_ID[t.match] : null;
  let body;

  if (t.status === 'waiting') {
    /* Jadwal sudah dimuat → tampilkan lawannya, bukan placeholder kosong */
    body = fixture
      ? '<div class="cell__wait">' +
          '<div class="cell__wait-label">Akan datang</div>' +
          '<div class="cell__wait-fixture">' +
            '<div class="cell__wait-team">' + plateHTML(t.teamA, '') + '<span>' + esc(t.teamA) + '</span></div>' +
            '<div class="cell__wait-vs">VS</div>' +
            '<div class="cell__wait-team">' + plateHTML(t.teamB, '') + '<span>' + esc(t.teamB) + '</span></div>' +
          '</div>' +
          '<div class="cell__wait-time u-num">' + esc(fixture.time) + ' WITA</div>' +
        '</div>'
      : '<div class="cell__wait">' +
          '<img class="cell__wait-brand" src="' + korsaMark() + '" alt="">' +
          '<div class="cell__wait-label">Menunggu Pertandingan</div>' +
        '</div>';
  } else {
    const row = (name, score, other, leading) =>
      '<div class="row' + (leading ? ' row--leading' : '') + '">' +
        plateHTML(name, 'row__logo') +
        '<div class="row__team">' +
          '<div class="row__name">' + esc(name) + '</div>' +
          '<div class="row__meter"><i style="width:' + meterPct(score, other) + '%"></i></div>' +
        '</div>' +
        '<div class="row__score u-num">' + score + '</div>' +
      '</div>';

    body = '<div class="cell__match">' +
             row(t.teamA, t.scoreA, t.scoreB, t.scoreA > t.scoreB) +
             row(t.teamB, t.scoreB, t.scoreA, t.scoreB > t.scoreA) +
             (t.status === 'finished'
               ? '<div class="cell__tag">' + (t.scoreA === t.scoreB ? 'Selesai' : 'Pemenang · ' +
                   esc(t.scoreA > t.scoreB ? t.teamA : t.teamB)) + '</div>'
               : '') +
           '</div>';
  }

  return '<div class="cell" data-status="' + t.status + '">' +
           '<div class="cell__head">' +
             '<span class="cell__table">Meja ' + t.id + '</span>' +
             (fixture ? '<span class="cell__phase">' + esc(fixture.phase) + '</span>' : '') +
             pillHTML(t.status) +
           '</div>' +
           body +
         '</div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   DISPLAY · BUKA / TUTUP / RASIO / LAYAR PENUH
   ═══════════════════════════════════════════════════════════════════════════ */
function openDisplay() {
  document.getElementById('admin').style.display = 'none';
  document.getElementById('display').dataset.open = 'true';
  renderDisplay();
}

function closeDisplay() {
  document.getElementById('display').dataset.open = 'false';
  document.getElementById('admin').style.display = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

function openDisplayWindow() {
  const w = window.open(location.pathname + '?display', 'korsa-display', 'width=1280,height=720');
  if (!w) alert('Jendela display diblokir browser. Izinkan pop-up untuk halaman ini, atau pakai tombol Pratinjau.');
}

/* Mark KORSA yang cocok dengan badan sel pada mode aktif */
function korsaMark() {
  return state.vtMode === 'light' ? KORSA_ON_LIGHT : KORSA_ON_DARK;
}

function toggleVtMode() {
  state.vtMode = (state.vtMode === 'dark') ? 'light' : 'dark';
  saveState();
  syncVtMode();
  renderDisplay();   /* mark KORSA di state menunggu ikut ditukar */
}

function syncVtMode() {
  const mode = (state.vtMode === 'light') ? 'light' : 'dark';
  document.getElementById('display').dataset.vtMode = mode;
  document.getElementById('btn-vtmode').textContent =
    (mode === 'dark') ? '☀ Mode Terang' : '☾ Mode Gelap';
}

function toggleRatio() {
  state.ratio = (state.ratio === 'fill') ? 'square' : 'fill';
  saveState();
  syncRatio();
}

function syncRatio() {
  document.getElementById('vt').dataset.ratio = state.ratio;
  document.getElementById('btn-ratio').textContent = (state.ratio === 'fill') ? '1:1' : 'Isi layar';
  requestAnimationFrame(fitDisplayTeamNames);
}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeTeamPops();
  const open = document.getElementById('display').dataset.open === 'true';
  if (e.key === 'Escape' && open && !document.fullscreenElement) closeDisplay();
});

window.addEventListener('resize', () => requestAnimationFrame(fitDisplayTeamNames));

/* Klik di luar area pemilih menutup dropdown tim yang sedang terbuka */
document.addEventListener('click', e => {
  if (!e.target.closest('.side__pick')) closeTeamPops();
});

/* ═══════════════════════════════════════════════════════════════════════════
   JAM
   ═══════════════════════════════════════════════════════════════════════════ */
function tick() {
  const p = n => String(n).padStart(2, '0');
  const d = new Date();
  const text = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  document.getElementById('clock').textContent = text;
  document.getElementById('vt-clock').textContent = text;
}
setInterval(tick, 1000);
tick();

/* ═══════════════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════════════ */
document.getElementById('toggle-aside').addEventListener('click', () => {
  const el = document.getElementById('admin');
  el.dataset.aside = (el.dataset.aside === 'open') ? 'closed' : 'open';
});

renderTeamNames();
renderTableCount();
renderBoard();
renderSchedule();
syncVtMode();
renderDisplay();
syncRatio();

if (location.search.indexOf('display') !== -1) openDisplay();
</script>
</body>
</html>
